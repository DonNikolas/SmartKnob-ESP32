; MQTT_PREP_V1
[platformio]
default_envs = smartknob

[env:smartknob]
build_src_filter = -<*> +<main.cpp>
platform = espressif32 @ 6.12.0
board = esp32-s3-devkitc-1
framework = arduino

; ESP32-S3-WROOM-1U-N16R8 memory configuration
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = default_16MB.csv

; Native USB serial connection and PSRAM support
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D BOARD_HAS_PSRAM

monitor_speed = 115200
upload_speed = 115200

[env:led_ring]
extends = env:smartknob
build_src_filter = -<*> +<led_ring.cpp>
lib_deps =
    adafruit/Adafruit NeoPixel @ 1.12.3

[env:psram_test]
extends = env:smartknob
build_src_filter = -<*> +<psram_test.cpp>

[env:display_test]
extends = env:smartknob
build_src_filter = -<*> +<display_test.cpp>
lib_deps =
    moononournation/GFX Library for Arduino @ 1.4.7
    lvgl/lvgl @ 8.3.11
build_flags =
    ${env:smartknob.build_flags}
    -D LV_CONF_INCLUDE_SIMPLE
    -I include

[env:bme280_test]
extends = env:smartknob
build_src_filter = -<*> +<bme280_test.cpp>
lib_deps =
    adafruit/Adafruit BME280 Library @ 2.2.4
    bblanchon/ArduinoJson @ 6.21.5

[env:microphone_test]
extends = env:smartknob
build_src_filter = -<*> +<microphone_test.cpp>
lib_deps =
    kosme/arduinoFFT @ 2.0.4

[env:microphone_level]
extends = env:smartknob
build_src_filter = -<*> +<microphone_level.cpp>
lib_deps =
    adafruit/Adafruit NeoPixel @ 1.12.3

[env:clap_detection]
extends = env:smartknob
build_src_filter = -<*> +<clap_detection.cpp>
lib_deps =
    adafruit/Adafruit NeoPixel @ 1.12.3

[env:hx711_test]
extends = env:smartknob
build_src_filter = -<*> +<hx711_test.cpp>
