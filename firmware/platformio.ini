    bogde/HX711 @ 0.7.5

[env:hx711_press]
extends = env:smartknob
build_src_filter = -<*> +<hx711_press.cpp>
lib_deps =
    bogde/HX711 @ 0.7.5
    adafruit/Adafruit NeoPixel @ 1.12.3

[env:angle_sensor_test]
extends = env:smartknob
build_src_filter = -<*> +<angle_sensor_test.cpp>

[env:motor_test]
extends = env:smartknob
build_src_filter = -<*> +<motor_test.cpp>
