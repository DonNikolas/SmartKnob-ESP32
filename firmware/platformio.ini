build_src_filter = -<*> +<press_feedback.cpp>
lib_deps =
    askuric/Simple FOC @ 2.3.3
    bogde/HX711 @ 0.7.5

; Integrated test. Other standalone environments remain unchanged.
[env:combined_controls]
extends = env:smartknob
build_src_filter = -<*> +<combined_controls.cpp> +<combined_ui.cpp>
lib_deps =
    askuric/Simple FOC @ 2.3.3
    bogde/HX711 @ 0.7.5
    adafruit/Adafruit NeoPixel @ 1.12.3
    moononournation/GFX Library for Arduino @ 1.4.7
    lvgl/lvgl @ 8.3.11
build_flags =
    ${env:smartknob.build_flags}
    -D LV_CONF_INCLUDE_SIMPLE
    -I include

; Local app GUI with automatic startup and continuous operation.
[env:app_gui]
extends = env:combined_controls
build_src_filter = -<*> +<app_gui_main.cpp> +<app_gui/view.cpp> +<app_gui/knob_fonts.c> +<app_gui/background.cpp> +<app_gui/radar.cpp> +<app_gui/light_link.cpp> +<app_gui/home_feeds.cpp> +<app_gui/mqtt_link.cpp> +<wifi_portal.cpp>

lib_deps =
    ${env:combined_controls.lib_deps}
    knolleary/PubSubClient @ 2.8
    adafruit/Adafruit BME280 Library @ 2.2.4
    bblanchon/ArduinoJson @ 6.21.5

; WLAN/location provisioning only. All motor outputs stay LOW.
[env:wifi_setup]
extends = env:smartknob
build_src_filter = -<*> +<wifi_setup.cpp>
lib_deps =
    moononournation/GFX Library for Arduino @ 1.4.7
    adafruit/Adafruit NeoPixel @ 1.12.3

